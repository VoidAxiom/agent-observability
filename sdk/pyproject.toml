[project]
name = "agent_obs_sdk"
version = "0.1.0"
description = "agent-observability Python SDK (M0 walking-skeleton)"
requires-python = ">=3.11"
dependencies = [
  "opentelemetry-sdk >=1.42.0,<2.0",
  "opentelemetry-exporter-otlp >=1.42.0,<2.0",
  "opentelemetry-instrumentation-openai >=0.60.0,<1.0",
]

[project.optional-dependencies]
dev = [
  "pytest >=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent_obs_sdk"]
