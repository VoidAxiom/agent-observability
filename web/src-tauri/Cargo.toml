[package]
name = "agent-observability"
version = "0.0.0"
description = "agent-observability local desktop UI"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "agent_observability_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
